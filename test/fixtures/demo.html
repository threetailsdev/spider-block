<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weekend in the garden</title>
<style>
  body { font: 17px/1.6 Georgia, serif; color: #2b2b2b; background: #fbfaf7; margin: 0; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 24px; }
  h1 { font: 700 34px/1.2 system-ui, sans-serif; margin: 0 0 6px; }
  .meta { color: #777; font: 14px system-ui, sans-serif; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  figure { margin: 0; }
  figure img { width: 100%; height: 190px; object-fit: cover; border-radius: 10px; display: block; }
  figcaption { font: 14px system-ui, sans-serif; color: #555; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>A weekend in the garden</h1>
  <div class="meta">Photos from Saturday and Sunday</div>
  <div class="grid">
    <figure><img src="/img/tomatoes.png?w=600&h=400&c=d9785b" alt="Ripe tomatoes"><figcaption>First tomatoes of the year</figcaption></figure>
    <figure><img id="hidden-1" src="/img/porch.png?w=600&h=400&c=8a7a6a"><figcaption>A wolf spider on the porch step</figcaption></figure>
    <figure><img src="/img/beans.png?w=600&h=400&c=7fae6a" alt="Runner beans"><figcaption>Runner beans climbing the fence</figcaption></figure>
    <figure><img src="/img/roses.png?w=600&h=400&c=d98fa8" alt="Roses"><figcaption>The roses finally opened</figcaption></figure>
    <figure><img id="hidden-2" src="/img/shed-garden-spider.png?w=600&h=400&c=9a8f70"><figcaption>Found in the shed</figcaption></figure>
    <figure><img src="/img/pond.png?w=600&h=400&c=6aa3c8" alt="The pond"><figcaption>The pond after the rain</figcaption></figure>
  </div>
</main>
</body>
</html>
